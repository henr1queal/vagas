services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: vagas-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: vagas
            DB_USERNAME: vagas
            DB_PASSWORD: secret
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - vagas

    nginx:
        image: nginx:1.25-alpine
        container_name: vagas-nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - vagas

    mysql:
        image: mysql:8.0
        container_name: vagas-mysql
        restart: unless-stopped
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: vagas
            MYSQL_USER: vagas
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - vagas-mysql:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - vagas

    mailpit:
        image: axllent/mailpit:latest
        container_name: vagas-mailpit
        restart: unless-stopped
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - vagas

networks:
    vagas:
        driver: bridge

volumes:
    vagas-mysql:
        driver: local
